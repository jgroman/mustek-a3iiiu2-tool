app-id: io.github.mustek.A3IIIU2Tool
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: mustek-gui
finish-args:
  # Display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Raw USB access to the scanner (055f:040b)
  - --device=all
  # Saved scans
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-desktop
modules:
  - name: mustek-a3iiiu2-tool
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-cache-dir --no-build-isolation --no-index
        --find-links=flatpak/wheels --prefix=/app ".[gui]"
      - install -Dm644 flatpak/io.github.mustek.A3IIIU2Tool.desktop
        /app/share/applications/io.github.mustek.A3IIIU2Tool.desktop
      - install -Dm644 flatpak/io.github.mustek.A3IIIU2Tool.cli.desktop
        /app/share/applications/io.github.mustek.A3IIIU2Tool.cli.desktop
      - install -Dm644 flatpak/io.github.mustek.A3IIIU2Tool.metainfo.xml
        /app/share/metainfo/io.github.mustek.A3IIIU2Tool.metainfo.xml
      - install -Dm644 flatpak/io.github.mustek.A3IIIU2Tool.png
        /app/share/icons/hicolor/256x256/apps/io.github.mustek.A3IIIU2Tool.png
    sources:
      - type: dir
        path: ..
