[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mustek-a3iiiu2-tool"
version = "0.1.0"
description = "Command-line and graphical scanning tool for the Mustek ScanExpress A3 USB PRO flatbed scanner"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mustek ScanExpress A3 USB PRO tool contributors" }]
keywords = ["scanner", "mustek", "a3iiiu2", "flatbed", "usb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
    "pyusb>=1.1.0",
    "Pillow>=8.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.4",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[project.scripts]
mustek-cli = "mustek_driver.cli:main"
mustek-gui = "mustek_driver.gui:run"

[project.urls]
Homepage = "https://github.com/example/mustek_a3iiiu2_tool"

[tool.setuptools]
packages = ["mustek_driver"]

[tool.setuptools.package-data]
mustek_driver = ["py.typed", "udev/*.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
